<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: bisque;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;  
        } 

        div.item{
            background-color: lightblue;
            border: 0.5px solid black; 
            text-align: center;   
            padding: 20px;
           
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item" style="align-self: flex-end;">B</div>
        <div class="item">C</div>
        <div class="item" style="align-self: flex-end;">D</div>
        <div class="item">E</div>
        <div class="item" style="align-self: flex-end;">F</div>
        <div class="item">G</div>
        <div class="item" style="align-self: flex-end;">H</div>
        <div class="item">I</div>
        <div class="item" style="align-self: flex-end;">J</div>
        
    </div>
</body>
</html>
