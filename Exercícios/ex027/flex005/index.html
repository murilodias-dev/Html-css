<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: bisque;
            display: flex;
            flex-flow: row wrap;
            
           
        } 

        div.item{
            background-color: lightblue;
            border: 0.5px solid black; 
            text-align: center;   
            padding: 20px;
           
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" style="order: -3;">A</div>
        <div class="item" style="order: -2;">B</div>
        <div class="item" style="order: -1;">C</div>
        <div class="item" style="order: 4;">D</div>
        <div class="item" style="order: 6;">E</div>
        <div class="item" style="order: 2;">F</div>
        <div class="item" style="order: 3;">G</div>
        <div class="item" style="order: 0;">H</div>
        <div class="item" style="order: 5;">I</div>
        <div class="item" style="order: 1;">J</div>
        
    </div>
</body>
</html>
