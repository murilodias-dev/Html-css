<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head> 

<style> 
    table#tabela1{
        border: 1px solid black;
        border-collapse: collapse;
        width: 400px;
        height: 400px;
    }
    
    .numero{ 
        text-align: right;
        vertical-align: middle;
    }

    td.td1{
        border: 1px solid black;
        padding: 10px; 
        text-align: center; 
        vertical-align: middle;
    }

    table#tabela2{
        background-color: purple;
        border: 1px solid black;
        border-collapse: collapse; 
        width: 500px;
        height: 500px;
    }

    td.td2{
        border: 1px solid black;
    } 

    #white{
        background-color: white;
    } 

    .black{
        background-color: black;
    }
</style>
<body>  
    <h1>Minha primeira tabela</h1>
    <table id="tabela1">
        
        <tr>

            <td class="td1">A1</td>
            <td class="td1">B1</td>
            <td class="td1">C1</td>  
            
        </tr>

        <tr>
            
            <td class="td1">A2</td>
            <td class="td1">B2</td>
            <td class="numero">300</td>  
            
        </tr>

        <tr>
            
            <td class="td1">A3</td>
            <td class="td1">B3</td>
            <td class="td1">C3</td>
        </tr> 
            
        <tr>
            <td class="td1">A4</td>
            <td class="td1">B4</td>
            <td class="td1">C4</td>
        </tr>
       
    </table>
    
    <h2>Desenhos em tabela</h2> 

    <table id="tabela2">
    
    <tr>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
    </tr>

    <tr>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
    </tr>

    <tr>
        <td class="td2"></td>
        <td class="td2" id="white"></td>
        <td class="td2 , black"></td>
        <td class="td2"></td>
    </tr>

    <tr>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2"></td>
    </tr>

    <tr>
        <td class="td2"></td>
        <td class="td2 , black"></td>
        <td class="td2 , black"></td>
        <td class="td2 , black"></td>
    </tr>

    <tr>
        <td class="td2"></td>
        <td class="td2"></td>
        <td class="td2 , black"></td>
        <td class="td2 , black"></td>
    </tr> 

    </table>  

</body>
</html>
