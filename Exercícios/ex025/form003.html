<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulário 3</h1> 
    <form action="cadastro.js" autocomplete="on" method="post">
        
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="usuario" id="iusu" required minlength="3" maxlength="15" size="15" placeholder="Digite seu usuário" autocomplete="username">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required minlength="6" maxlength="12" placeholder="Digite sua senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" name="Enviar">
            <input type="reset" name="Limpar">
        </p>
    </form>
</body>
</html>
