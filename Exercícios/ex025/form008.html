<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 8</title>
</head>
<body>
    <p>
     <label for="in1">Número 1:</label>
    <input type="number" id="in1" name="n1" placeholder="Digite um número" min="0" max="50" oniput required>
    </p>
    
    <p>
     <label for="in2">Número 2:</label>
    <input type="number" id="in2" name="n2" placeholder="Digite outro número" min="0" max="50" required>
    </p>

    <p>
        <input type="button" value="Somar" onclick="somar()">
    </p>

    <p>
        <label for="ire">Resultado:</label>
        <output name="resultado" id="ire" for="in1 in2">...</output>

    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

    <script>
        function somar(){
            
            const n1 = document.getElementById("in1");
            const n2 = document.getElementById("in2");
            const soma = Number(n1.value) + Number(n2.value);
            
            const resultado = document.getElementById("ire");

            resultado.innerHTML = soma;
        }
    </script>
</body>
</html>
