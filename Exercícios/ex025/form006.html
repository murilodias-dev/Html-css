<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 6</title>
    <style>
        input[type="color"] {
            width: 25px;
            height: 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" id="icor" name="cor" value="#0000ff">
        </p> 

        <p>
            <label for="inivel">Nível de satisfação:</label>
            <input type="range" id="inivel" name="nivel" min="0" max="10" step="1" value="5">
        </p>

        <p>
            <label for="ifile">Arquivo:</label>
            <input type="file" id="ifile" name="arquivo" accept=".jpg, .jpeg, .png, .pdf">
        </p>

        <p>
            <input type="submit" id="isubmit" value="Enviar">
            <input type="reset" id="ireset" value="Limpar">
        </p>

    </form>
</body>
</html>
