<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <h2>Esse é um formulario teste:</h2> 
    <form action="cadastro.js" autocomplete="off" method="post">
       <p><label for="inome">Nome:</label> <input type="text" name="Nome" id="inome"></p>  
       <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="Sobrenome" id="isobrenome"></p> 
       <p><label for="iidade">Idade:</label> <input type="number" name="idade" id="iidade" style="width: 100px;" ></p> 
       <input type="submit" style="margin-left: 10px;">
    </form>
</body>
</html>
