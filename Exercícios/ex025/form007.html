<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 7</title>
</head> 
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="">
        <p>
            <label for="iest">Estado</label>
            <select id="iest" name="estado">
                <optgroup label="Região Sudeste">
                    <option value="">Selecione um estado</option>
                    <option value="sp">São Paulo</option>
                    <option value="rj">Rio de Janeiro</option>
                    <option value="mg">Minas Gerais</option>
                </optgroup>

                <optgroup label="Região Sul">
                    <option value="pr">Paraná</option>
                    <option value="sc">Santa Catarina</option>
                    <option value="rs">Rio Grande do Sul</option>
                </optgroup>
            </select> 

        <p>
            <label for="iprof">Profissão</label>
            <input list="profissoes" id="iprof" name="profissao" placeholder="Digite sua profissão">
            <datalist id="profissoes">
                <option value="engenheiro">Engenheiro</option>
                <option value="professor">Professor</option>

                <optgroup label="Profissões da área da saúde">
                    <option value="médico">Médico</option>
                    <option value="enfermeira">Enfermeira</option>
                </optgroup>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>


        </p>

        <p>
            <label for="ipassword">Senha:</label>
            <input type="password" id="ipassword" name="senha" placeholder="Digite sua senha">
        </p>

        <p>
            <label for="iemail">Email:</label>
            <input type="email" id="iemail" name="email" placeholder="Digite seu email">
        </p>

        <p>
            <label for="inumber">Número:</label>
            <input type="number" id="inumber" name="numero" min="1" max="100">
        </p>

        <p>
            <input type="submit" id="isubmit" value="Enviar">
            <input type="reset" id="ireset" value="Limpar">
        </p>

    </form>
</body>
</html>
