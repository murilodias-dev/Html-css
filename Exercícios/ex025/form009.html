<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 9</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <p>
        <label for="inum">Numero: </label>
        <input type="range" id="inum" oninput="ival.innerHTML = Number(inum.value)"> 
        <output id="ival">50</output>
    </p>
</body>
</html>
