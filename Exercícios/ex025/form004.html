<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4</title>
</head>
<body>
    <form action="">
        <p><label for="inome">Nome:</label></p>
        <p><input type="text" id="inome" name="nome" placeholder="Nome Completo" maxlength="30"></p>
        
        <p><label for="iemail">E-mail:</label></p>
        <p><input type="email" id="iemail" name="email" placeholder="E-mail"></p> 

        <p><label for="iperiodo">Período Letivo: </label></p>
        <p><input type="month" id="iperiodo" name="periodo" placeholder="Período Letivo"></p>

        <p><label for="imedia">Média:</label></p>
        <p><input type="number" id="imedia" name="media" placeholder="0 a 10" min="0" max="10" step="0.1" value="5"></p> 

        <p><input type="submit" id="isubmit" value="Enviar"></p>
        <p><input type="reset" id="ireset" value="Limpar"></p>
        
    </form>
</body>
</html>
